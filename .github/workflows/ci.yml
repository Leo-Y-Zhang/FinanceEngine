name: CI

# Every gate this project claims to hold itself to, run on every push, so the
# claims in the README are checked rather than asserted.
#
# Every step here is runnable locally with the same command; they are
# deliberately identical to the ones in README.md and docs/SESSION_HANDOFF.md, so
# a red run can always be reproduced without waiting on a runner.
#
# (A note that Actions was billing-blocked at account level stood here from
# 2026-07 to 2026-08. It is no longer true — run 30820556169 on 2026-08-03 went
# green on both jobs — so it has been removed rather than left to mislead.)

on:
  push:
    branches: [main]
  # Scoped to main. Unscoped, a branch that has an open PR fires BOTH this and
  # the push trigger above, running the whole gate twice for one commit — and
  # Actions minutes on private repos are a metered, exhaustible resource.
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. A rapid series of pushes otherwise leaves superseded runs
# grinding through the full matrix for a commit nobody is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (lint, tests, coverage, deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check finance_engine tests

      - name: Tests with coverage floor
        run: pytest --cov=finance_engine --cov-report=term-missing

      # Audits a frozen list of the THIRD-PARTY dependencies rather than the
      # whole environment, because the environment also contains this project
      # itself as an editable install and pip-audit tries to resolve every
      # installed distribution against PyPI. `--strict` (fail when anything
      # could not be audited) is kept: it is the point of the step.
      #
      # This is not cosmetic. Under the old project name the environment audit
      # "passed" only because an UNRELATED package of that name exists on PyPI,
      # so the step was silently auditing a stranger's releases. Excluding the
      # local project is what the step always meant to do.
      - name: Dependency audit
        run: |
          pip freeze --exclude-editable > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt

      # The gate's honesty promise, run over the committed fixture corpus. The
      # live snapshot is gitignored and needs a network fetch, so CI checks the
      # reproducible half; the live number is recorded in the handoff.
      - name: Honesty eval (fixture corpus)
        run: python -m finance_engine.eval

  web:
    name: web (types, tests, build, deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (includes axe accessibility checks)
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate
  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
